name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::106940013558:role/github-actions-cicd-learning-deploy
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2   


      - name: Build, tag, and push image
        run: |
          docker build -t myapp:test ./app
          docker tag myapp:test ${{ steps.ecr.outputs.registry }}/myapp:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/myapp:${{ github.sha }}

